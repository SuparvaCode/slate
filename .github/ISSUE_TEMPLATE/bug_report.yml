name: Bug report
description: Something in Slate does not work as documented.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Do not report a security problem here.** Follow [SECURITY.md](../blob/main/SECURITY.md)
        instead — a public issue would expose everyone using the code.

        Reproduce on `main` first: problems in your own deployment, Firebase project or provider
        account are out of scope (see [SUPPORT.md](../blob/main/SUPPORT.md)).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Sign in with Google
        2. Write 2x + 5 = 13 on the board and circle it
        3. Nothing is written back
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Web app (board, tools, panels)
        - Server API
        - AI pipeline (recognition, solving, notes, diagrams)
        - Android shell
        - Desktop shell
        - Rules (Firestore / Realtime Database)
        - Documentation
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: The `main` commit you are on (`git rev-parse --short HEAD`).
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser or device, and whether you used the Firebase emulators.
      placeholder: Windows 11, Node 22.18.0, Chrome 142, no emulators
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        **Remove tokens, keys, uids, email addresses and board contents first.** Paste only what
        is needed to see the problem.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I checked this against `main`, not a modified copy.
          required: true
        - label: I removed credentials and personal data from the logs above.
          required: true
        - label: This is not a security report (those go through SECURITY.md).
          required: true
