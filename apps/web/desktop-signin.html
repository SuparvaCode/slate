<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in to Slate</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { height: 100%; margin: 0; background: #1c1c1e; color: #f5f5f7; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
      h1 { margin: 8px 0 0; font-size: 24px; }
      p { margin: 0; color: #a1a1a6; max-width: 340px; }
      button { margin-top: 10px; display: inline-flex; align-items: center; gap: 10px; padding: 12px 26px; border: 0; border-radius: 999px; background: #fff; color: #1d1d1f; font: 600 16px system-ui, sans-serif; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: default; }
      .err { color: #ff6961; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" width="64" height="64" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#2c2c2e" />
        <path d="M 336 166 C 300 128 196 132 188 196 C 180 262 330 250 326 320 C 322 392 210 398 172 352" fill="none" stroke="#f5f5f7" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 160 424 L 352 424" stroke="#0a84ff" stroke-width="30" stroke-linecap="round" />
      </svg>
      <h1>Sign in to the Slate app</h1>
      <p id="msg">Choose your Google account. You'll go back to the Slate app straight after.</p>
      <button id="go" type="button" hidden>Continue with Google</button>
    </main>
    <script type="module" src="/src/desktop-signin.ts"></script>
  </body>
</html>
